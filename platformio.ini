; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = nologo_esp32c3_super_mini
framework = arduino
monitor_speed = 9600
; Dual-OTA partition layout (ota_0/ota_1 + nvs + spiffs) so the web update
; page (see web_page.h) can flash the inactive slot while current firmware
; keeps running. The very first flash after this changes must be over USB —
; changing the partition table itself isn't OTA-able.
board_build.partitions = min_spiffs.csv
lib_deps =
    https://github.com/thePunderWoman/HumanCyborgRelationsAPI.git#1.0.5
